---
- name: Ensure zsh, git, and curl are installed
  pacman:
    name:
      - zsh
      - git
      - curl
    state: present
    update_cache: yes
  become: yes

- name: Check if Oh My Zsh is installed
  stat:
    path: "{{ lookup('env', 'HOME') }}/.oh-my-zsh"
  register: omz_installed

- name: Clone Oh My Zsh repository
  git:
    repo: "https://github.com/ohmyzsh/ohmyzsh.git"
    dest: "{{ lookup('env', 'HOME') }}/.oh-my-zsh"
    version: master
  when: not omz_installed.stat.exists

- name: Create initial .zshrc from template
  copy:
    src: "{{ lookup('env', 'HOME') }}/.oh-my-zsh/templates/zshrc.zsh-template"
    dest: "{{ lookup('env', 'HOME') }}/.zshrc"
    remote_src: yes
    force: no
  when: not omz_installed.stat.exists

- name: Clone zsh-autosuggestions plugin
  git:
    repo: "https://github.com/zsh-users/zsh-autosuggestions"
    dest: "{{ lookup('env', 'HOME') }}/.oh-my-zsh/custom/plugins/zsh-autosuggestions"

- name: Clone zsh-syntax-highlighting plugin
  git:
    repo: "https://github.com/zsh-users/zsh-syntax-highlighting.git"
    dest: "{{ lookup('env', 'HOME') }}/.oh-my-zsh/custom/plugins/zsh-syntax-highlighting"

- name: Change user default shell to zsh
  user:
    name: "{{ ansible_user_id }}"
    shell: /bin/zsh
  become: yes

- name: Update ZSH_THEME in .zshrc
  lineinfile:
    path: "{{ lookup('env', 'HOME') }}/.zshrc"
    regexp: '^ZSH_THEME='
    line: 'ZSH_THEME="{{ omz_theme }}"'

- name: Update plugins in .zshrc
  lineinfile:
    path: "{{ lookup('env', 'HOME') }}/.zshrc"
    regexp: '^plugins=\('
    line: 'plugins=({{ omz_plugins | join(" ") }})'
