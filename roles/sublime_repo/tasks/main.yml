---
- name: Add and locally sign the Sublime Text GPG key
  community.general.pacman_key:
    id: 1EDDE2CDFC025D17F6DA9EC0ADAE6AD28A8F901A
    url: https://download.sublimetext.com/sublimehq-pub.gpg
    state: present

# The repo may already be configured by hand, without the block marker below
- name: Check for the Sublime Text repository in pacman.conf
  command: grep -qx '\[sublime-text\]' /etc/pacman.conf
  register: sublime_repo_check
  failed_when: sublime_repo_check.rc > 1
  changed_when: false
  check_mode: no

- name: Add Sublime Text repository to pacman.conf
  blockinfile:
    path: /etc/pacman.conf
    block: |
      [sublime-text]
      Server = https://download.sublimetext.com/arch/stable/x86_64
    marker: "# {mark} ANSIBLE MANAGED BLOCK: sublime-text repo"
  when: sublime_repo_check.rc != 0

- name: Install Sublime Text and Sublime Merge
  pacman:
    name:
      - sublime-text
      - sublime-merge
    state: present
    update_cache: "{{ sublime_repo_check.rc != 0 }}"
