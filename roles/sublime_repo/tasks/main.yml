---
- name: Download Sublime Text GPG key
  get_url:
    url: https://download.sublimetext.com/sublimehq-pub.gpg
    dest: /tmp/sublimehq-pub.gpg

- name: Add Sublime Text GPG key to pacman-key
  command: pacman-key --add /tmp/sublimehq-pub.gpg
  become: yes

- name: Locally sign the Sublime Text GPG key
  command: pacman-key --lsign-key 8A8F901A
  become: yes

- name: Cleanup downloaded key
  file:
    path: /tmp/sublimehq-pub.gpg
    state: absent

- name: Add Sublime Text repository to pacman.conf
  blockinfile:
    path: /etc/pacman.conf
    block: |
      [sublime-text]
      Server = https://download.sublimetext.com/arch/stable/x86_64
    marker: "# {mark} ANSIBLE MANAGED BLOCK: sublime-text repo"
  become: yes

- name: Install Sublime Text and Sublime Merge
  pacman:
    name:
      - sublime-text
      - sublime-merge
    state: present
    update_cache: yes
  become: yes
