---
- name: Ensure Code command is available
  command: code --version
  register: code_check
  ignore_errors: yes
  changed_when: false
  check_mode: no

- name: Install VS Code extensions
  command: code --install-extension {{ item }}
  loop: "{{ vscode_extensions }}"
  register: vscode_install
  changed_when: "'already installed' not in (vscode_install.stdout | default(''))"
  when: code_check.rc == 0
