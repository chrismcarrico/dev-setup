---
- name: Clone personal dotfiles repository
  git:
    repo: "https://github.com/chrismcarrico/dotfiles"
    dest: "{{ dotfiles_path }}"
    update: no

# Installs Oh My Zsh and symlinks home/ into $HOME. Anything already there is
# moved to <file>.bak-<timestamp>.
- name: Run dotfiles setup script
  command: "{{ dotfiles_path }}/setup.sh"
  register: dotfiles_setup
  changed_when: "' -> ' in (dotfiles_setup.stdout | default('')) or 'cloning' in (dotfiles_setup.stdout | default(''))"

# setup.sh can't run chsh without a terminal
- name: Change user default shell to zsh
  user:
    name: "{{ lookup('env', 'USER') }}"
    shell: /usr/bin/zsh
  become: yes
