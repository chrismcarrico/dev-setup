---
- name: Clone personal dotfiles repository
  git:
    repo: "https://github.com/chrismcarrico/dotfiles"
    dest: "{{ dotfiles_path }}"
    update: no

# Uses git rather than the upstream installer, which rewrites ~/.zshrc
- name: Install Oh My Zsh
  git:
    repo: "https://github.com/ohmyzsh/ohmyzsh.git"
    dest: "{{ oh_my_zsh_path }}"
    depth: 1
    update: no

# Symlinks home/ into $HOME. Anything already there is moved to
# <file>.bak-<timestamp>.
- name: Link dotfiles into home directory
  command: "{{ dotfiles_path }}/scripts/link.sh"
  register: dotfiles_link
  changed_when: "' -> ' in (dotfiles_link.stdout | default(''))"

- name: Change user default shell to zsh
  user:
    name: "{{ lookup('env', 'USER') }}"
    shell: /usr/bin/zsh
  become: yes
