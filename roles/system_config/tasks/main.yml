---
- name: Ensure Docker service is enabled and started
  systemd:
    name: docker
    state: started
    enabled: yes
  become: yes

# ansible_user_id is root here because the play gathers facts with become
- name: Add user to docker group
  user:
    name: "{{ lookup('env', 'USER') }}"
    groups: docker
    append: yes
  become: yes
