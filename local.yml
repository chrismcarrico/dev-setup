---
- name: Configure Arch Linux Dev Machine
  hosts: localhost
  connection: local
  become: yes

  roles:
    - { role: core_packages, tags: core }
    # Run yay role before aur_packages since aur_packages needs an AUR helper
    - { role: yay, tags: yay }
    - { role: aur_packages, tags: aur }
    - { role: sublime_repo, tags: sublime }
    # Needs the packages above, and owns ~/.zshrc and the KDE configs
    - { role: dotfiles, tags: dotfiles, become: no }
    - { role: rust_setup, tags: rust, become: no }
    - { role: python_setup, tags: python, become: no }
    - { role: vscode_extensions, tags: vscode, become: no }
    - { role: claude_code, tags: claude, become: no }
    - { role: system_config, tags: config }
    - { role: github_repos, tags: github, become: no }
    # Needs an SSH key on GitHub, so this only runs with --tags personal-repos
    - { role: personal_repos, tags: [personal-repos, never], become: no }
